# Fabrique Poudreuse.exe pour Windows à chaque envoi de code.
# Chaque mise à jour de la branche main publie une nouvelle version dans « Releases »,
# avec Poudreuse.exe en téléchargement direct.
name: Compiler Poudreuse.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Vérifier les calculs
        run: python -m pytest -q

      - name: Compiler l'exécutable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Poudreuse
          --icon poudreuse/ressources/poudreuse.ico
          --add-data "poudreuse/ressources;poudreuse/ressources"
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml
          --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtCharts --exclude-module tkinter
          main.py

      - name: Vérifier que le programme démarre
        shell: pwsh
        run: |
          $p = Start-Process dist\Poudreuse.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited -and $p.ExitCode -ne 0) { throw "Poudreuse.exe s'est arrêté (code $($p.ExitCode))" }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - uses: actions/upload-artifact@v4
        with:
          name: Poudreuse-windows
          path: dist/Poudreuse.exe

      - name: Publier la version (téléchargement direct dans « Releases »)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Poudreuse ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/Poudreuse.exe
          body: |
            Téléchargez **Poudreuse.exe** ci-dessous, puis double-cliquez dessus.
            Si Windows affiche « Windows a protégé votre ordinateur », cliquez sur « Informations complémentaires », puis « Exécuter quand même ».
